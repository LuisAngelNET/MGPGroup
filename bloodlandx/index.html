<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detorument</title>
    <style>
        :root {
            --bg-main: #0b0b0f;
            --bg-card: #121216;
            --border-color: #1e1e26;
            --text-light: #ffffff;
            --text-muted: #8e8e99;
        }
        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            text-align: center;
        }
        .container {
            max-width: 520px;
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 60px 40px;
            box-sizing: border-box;
        }
        .title {
            font-family: "Didot", "Bodoni MT", "Cinzel", "Georgia", serif;
            font-size: 3.2rem;
            font-weight: 400;
            letter-spacing: -1px;
            margin: 0 0 20px 0;
        }
        .image {
            margin: 30px 0;
            max-width: 100%;
            height: auto;
            border-radius: 12px;
            border: 1px solid #1e1e26;
        }
        .description {
            color: var(--text-muted);
            font-size: 1.1rem;
            line-height: 1.65;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Info:</h1>
        
        <img src="61 sin título_20260720224411.png" alt="BloodLandX" class="image">
        
        <p class="description">
            a remake of the bloodland demon by sr.cubo<br>
            percentage of the completed level: 5%
        </p>
    </div>
</body>
</html>
