<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting - MGPGroup</title>
    <style>
        :root {
            --bg-main: #0b0b0f;
            --bg-card: #121216;
            --text-light: #ffffff;
            --text-muted: #a0a0aa;
            --blue-accent: #1d4ed8;
            --discord-color: #5865F2;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .card {
            background-color: var(--bg-card);
            border: 1px solid #1f1f29;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .stickman-box {
            width: 100px;
            height: 120px;
            margin: 0 auto 20px auto;
        }

        .head-circle { fill: none; stroke: var(--text-light); stroke-width: 3; }
        .body-line { stroke: var(--text-light); stroke-width: 3; }
        
        .arm-left {
            stroke: var(--text-light); stroke-width: 3; fill: none;
            transform-origin: 50px 50px;
            transform: rotate(-60deg) translateY(-5px);
        }
        .arm-right {
            stroke: var(--text-light); stroke-width: 3; fill: none;
            transform-origin: 50px 50px;
            transform: rotate(60deg) translateY(-5px);
        }
        .mouth {
            stroke: var(--text-light); stroke-width: 2; fill: none;
            d: path("M 44 26 Q 50 34 56 26");
        }
        .head-group {
            transform-origin: 50px 50px;
            transform: translateY(-2px);
        }

        p {
            color: var(--text-muted);
            font-size: 1.1rem;
            margin: 10px 0;
            line-height: 1.5;
        }

        .countdown-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: var(--discord-color);
            margin: 15px 0;
        }

        a {
            color: var(--text-light);
            text-decoration: none;
            border-bottom: 1px dashed var(--text-muted);
            font-size: 0.9rem;
        }
        a:hover {
            color: var(--discord-color);
            border-bottom-color: var(--discord-color);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="stickman-box">
            <svg viewBox="0 0 100 120" width="100%" height="100%">
                <g class="head-group">
                    <circle cx="50" cy="25" r="12" class="head-circle" />
                    <circle cx="46" cy="22" r="1.5" fill="white" />
                    <circle cx="54" cy="22" r="1.5" fill="white" />
                    <path class="mouth" />
                </g>
                <line x1="50" y1="37" x2="50" y2="75" class="body-line" />
                <path d="M 50 50 L 25 50" class="arm-left" />
                <path d="M 50 50 L 75 50" class="arm-right" />
                <line x1="50" y1="75" x2="35" y2="105" class="body-line" />
                <line x1="50" y1="75" x2="65" y2="105" class="body-line" />
            </svg>
        </div>

        <p>Connecting to Discord server...</p>
        <div class="countdown-number" id="timer">5</div>
        <p><a href="https://discord.com/invite/9Hcq2avbHS" rel="noopener noreferrer">Click here to skip the wait, or if you weren't redirected.</a></p>
    </div>

    <script>
        const targetUrl = "https://discord.com/invite/9Hcq2avbHS";
        let secondsLeft = 5;
        const timerElement = document.getElementById("timer");

        const countdown = setInterval(() => {
            secondsLeft--;
            timerElement.textContent = secondsLeft;
            
            if (secondsLeft <= 0) {
                clearInterval(countdown);
                window.location.href = targetUrl;
            }
        }, 1000);
    </script>
</body>
</html>
