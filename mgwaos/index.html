<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGWaos - Geometry Dash</title>
    <style>
        :root { --bg-main: #0b0b0f; --bg-card: #121216; --border: #1e1e26; --text: #ffffff; --muted: #8e8e99; --purple: #4c1d95; }
        body { background: var(--bg-main); color: var(--text); font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 24px; display: flex; align-items: center; justify-content: center; min-height: 100vh; box-sizing: border-box; }
        .container { max-width: 500px; width: 100%; background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px; padding: 32px; box-sizing: border-box; }
        .brand-title { font-family: "Didot", serif; font-size: 2.2rem; margin: 0 0 12px; }
        .description { color: var(--muted); line-height: 1.6; margin: 0 0 32px; }
        .section-title { font-size: 1rem; text-transform: uppercase; color: var(--muted); margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .live-dot { width: 8px; height: 8px; background: #ef4444; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        .list { display: flex; flex-direction: column; gap: 14px; margin-bottom: 24px; }
        .card, .nav-item { background: #17171f; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: 0.2s; text-decoration: none; color: inherit; }
        .card:hover, .nav-item:hover { border-color: var(--purple); }
        .thumb { position: relative; aspect-ratio: 16/9; cursor: pointer; background: no-repeat center/cover; display: flex; align-items: center; justify-content: center; }
        .thumb::before { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,0.4); }
        .play { position: relative; width: 48px; height: 48px; background: rgba(0,0,0,0.8); border: 2px solid var(--text); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .card:hover .play { transform: scale(1.1); background: var(--purple); border-color: var(--purple); }
        .info { padding: 12px 16px; font-size: 0.95rem; font-weight: 500; }
        .player { width: 100%; aspect-ratio: 16/9; border: none; display: block; }
        .nav-item { padding: 16px 20px; display: flex; justify-content: space-between; font-weight: 500; }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="brand-title">MGWaos</h1>
        <p class="description">We are the best Geometry Dash level creator Group.</p>

        <h2 class="section-title"><span class="live-dot"></span> Últimos Videos</h2>
        <div class="list" id="video-list"></div>

        <div class="list">
            <a href="/discord/" class="nav-item"><span>🔵 Discord Server</span> ➔</a>
            <a href="/members" class="nav-item"><span>🔵 Members</span> ➔</a>
        </div>
    </div>

    <script>
        // Datos de los videos concentrados para no repetir estructura HTML
        const videos = [
            { id: 'hSyBaSZQUEU', title: 'Dia 7 Creando un extreme demon #geometrydash' },
            { id: 'fPZehC2q67A', title: 'Dia 8 Creando un extreme demon #geometrydash' },
            { id: 'HIBSC83KJ3Y', title: 'Dia 4 creando un extreme demon #geometrydash #gddemon' },
            { id: 'nwXizuotnd0', title: 'Dia 3 creando un extreme demon #gddemon #gd' },
            { id: '_Ec905D-4IE', title: '1 in a Million Geometry Dash Moments' }
        ];

        // Renderizado automático de la lista
        const container = document.getElementById('video-list');
        videos.forEach(v => {
            container.innerHTML += `
                <div class="card">
                    <div class="thumb" style="background-image: url('https://youtube.com{v.id}/mqdefault.jpg');" onclick="play(this, '${v.id}')">
                        <div class="play"><svg width="16" height="16" viewBox="0 0 24 24" fill="white"><path d="M8 5v14l11-7z"/></svg></div>
                    </div>
                    <div class="info">${v.title}</div>
                </div>`;
        });

        // Función del reproductor integrado
        function play(el, id) {
            el.parentNode.innerHTML = `<iframe src="https://youtube.com{id}?autoplay=1" class="player" allow="autoplay; encrypted-media" allowfullscreen></iframe>`;
        }
    </script>
</body>
</html>
