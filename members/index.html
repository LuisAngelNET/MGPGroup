<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGPGroup - Members</title>
    <style>
        :root {
            --bg-main: #0b0b0f;
            --bg-card: #121216;
            --border-color: #1e1e26;
            --text-light: #ffffff;
            --text-muted: #8e8e99;
            --blue-accent: #1d4ed8;
            --purple-accent: #4c1d95;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 56px 40px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: geopolitical;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid #1a1a24;
        }

        .brand-title {
            font-family: "Didot", "Bodoni MT", "Cinzel", "Georgia", serif;
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .description {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.7;
            margin: 0 0 48px 0;
        }

        .members-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .member-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: #17171f;
            border: 1px solid var(--border-color);
            padding: 24px 16px;
            border-radius: 16px;
            text-decoration: none;
            color: var(--text-light);
            transition: background-color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
            text-align: center;
            box-sizing: border-box;
        }

        .member-card:hover {
            background-color: #1c1c26;
            border-color: var(--purple-accent);
            transform: translateY(-2px);
        }

        .pfp-avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #2a2a35;
            border: 2px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 12px;
        }

        .member-name {
            font-size: 0.95rem;
            font-weight: 500;
            word-break: break-word;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 class="brand-title">Members</h1>
        </div>

        <p class="description">
            the members of the best Geometry Dash creation level Group.
        </p>

        <div class="members-grid">
            <a href="#" class="member-card">
                <img src="owner.jpg" alt="808_MGP" class="pfp-avatar">
                <span class="member-name">808_MGP</span>
            </a>

            <a href="#" class="member-card">
                <img src="are.jpg" alt="are" class="pfp-avatar">
                <span class="member-name">are</span>
            </a>

            <a href="#" class="member-card">
                <img src="gtjgr.jpg" alt="gtjgr" class="pfp-avatar">
                <span class="member-name">gtjgr</span>
            </a>

            <a href="#" class="member-card">
                <img src="trobox.jpg" alt="trobox" class="pfp-avatar">
                <span class="member-name">trobox</span>
            </a>

            <a href="#" class="member-card">
                <img src="eshaw.jpg" alt="eshaw" class="pfp-avatar">
                <span class="member-name">eshaw</span>
            </a>

            <a href="#" class="member-card">
                <img src="foxy.jpg" alt="foxy" class="pfp-avatar">
                <span class="member-name">foxy</span>
            </a>

            <a href="#" class="member-card">
                <img src="elaldoxito.jpg" alt="elaldoxito" class="pfp-avatar">
                <span class="member-name">elaldoxito</span>
            </a>

            <a href="#" class="member-card">
                <img src="da12r.jpg" alt="da12r" class="pfp-avatar">
                <span class="member-name">da12r</span>
            </a>
        </div>
    </div>

</body>
</html>
