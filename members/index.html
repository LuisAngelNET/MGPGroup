<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGPGroup/members - GitHub</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --border-color: #30363d;
            --text-primary: #c9d1d9;
            --text-secondary: #8b949e;
            --link-color: #58a6ff;
            --hover-bg: #161b22;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1012px;
            margin: 0 auto;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .repo-header {
            padding: 16px;
            background-color: #161b22;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        .repo-path {
            font-weight: 600;
        }

        .repo-path a {
            color: var(--link-color);
            text-decoration: none;
        }

        .repo-path a:hover {
            text-decoration: underline;
        }

        .file-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .file-item {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            font-size: 14px;
        }

        .file-item:last-child {
            border-bottom: none;
        }

        .file-item:hover {
            background-color: var(--hover-bg);
        }

        .file-icon {
            margin-right: 10px;
            display: flex;
            align-items: center;
        }

        /* Icono SVG que simula el archivo de imagen de GitHub */
        .icon-img {
            fill: var(--text-secondary);
        }

        .file-name {
            flex-grow: 1;
        }

        .file-name a {
            color: var(--text-primary);
            text-decoration: none;
        }

        .file-name a:hover {
            color: var(--link-color);
            text-decoration: underline;
        }

        /* Resaltado especial para tu usuario */
        .user-first {
            font-weight: 600;
            background-color: rgba(88, 166, 255, 0.05);
        }
    </style>
</head>
