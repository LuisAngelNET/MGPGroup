<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MGPGroup</title>
    <style>
        :root {
            --bg-main: #0b0b0f;
            --bg-card: #121216;
            --border-color: #1e1e26;
            --text-light: #ffffff;
            --text-muted: #8e8e99;
            --blue-accent: #1d4ed8;
            --purple-accent: #4c1d95;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-light);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 480px;
            width: 100%;
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 56px 40px;
            box-sizing: border-box;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: geopolitical;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid #1a1a24;
        }

        .brand-title {
            font-family: "Didot", "Bodoni MT", "Cinzel", "Georgia", serif;
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: -0.5px;
            margin: 0;
        }

        .description {
            color: var(--text-muted);
            font-size: 1.05rem;
            line-height: 1.7;
            margin: 0 0 48px 0;
        }

        .nav-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #17171f;
            border: 1px solid var(--border-color);
            padding: 18px 24px;
            border-radius: 12px;
            text-decoration: none;
            color: var(--text-light);
            font-size: 0.95rem;
            font-weight: 500;
            transition: background-color 0.2s ease, border-color 0.2s ease;
        }

        .nav-item:hover {
            background-color: #1c1c26;
            border-color: var(--purple-accent);
        }

        .nav-item span {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .indicator {
            width: 6px;
            height: 6px;
            background-color: var(--blue-accent);
            border-radius: 50%;
        }

        .arrow-icon {
            opacity: 0.4;
            transition: opacity 0.2s ease;
        }

        .nav-item:hover .arrow-icon {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1 class="brand-title">MGPGroup</h1>
        </div>

        <p class="description">
            We are the best Geometry Dash level creator Group.
            if you want to help please join the discord server.
        </p>

        <div class="nav-list">
            <a href="/discord/" class="nav-item">
                <span>
                    <span class="indicator"></span>
                    Discord Server
                </span>
                <svg class="arrow-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </a>
        </div>
    </div>

</body>
</html>
